<main class="container admin-screen admin-login">
  <app-brand-logo />
  <h1>Administrator sign-in</h1>
  @if (expired) { <p role="status">Your session expired, sign in again.</p> }
  @if (checking()) {
    <p role="status">Checking your session…</p>
  } @else if (enrolling() && sessions.session()) {
    <p>Set up an authenticator before accessing the dashboard.</p>
    <app-admin-totp-setup (completed)="openDashboard()" />
    <button type="button" class="secondary-button" (click)="cancelSetup()">Sign out</button>
  } @else {
    <form (submit)="signIn($event, email.value, password, code)">
      <app-form-field #emailField controlId="admin-email" label="Email" [required]="true">
        <input #email [appFieldControl]="emailField" type="email" autocomplete="username" required maxlength="254" />
      </app-form-field>
      <app-form-field #passwordField controlId="admin-password" label="Password" [required]="true">
        <input #password [appFieldControl]="passwordField" type="password" autocomplete="current-password" required />
      </app-form-field>
      <app-form-field #codeField controlId="admin-code" label="Authenticator or recovery code"
        hint="Leave blank if you haven’t enrolled an authenticator yet.">
        <input #code [appFieldControl]="codeField" type="text" autocomplete="one-time-code" maxlength="40" />
      </app-form-field>
      <button type="submit" class="primary-button" [disabled]="busy()">{{ busy() ? 'Signing in…' : 'Sign in' }}</button>
    </form>
  }
  @if (error()) { <p role="alert" class="error-text">{{ error() }}</p> }
  <a routerLink="/">Back to store</a>
</main>
