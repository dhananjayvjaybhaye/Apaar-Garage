@if (visible()) {
  <dialog
    #modal
    class="garage-intro"
    [class.opening]="opening()"
    aria-labelledby="garage-intro-title"
    (cancel)="dismiss($event)"
  >
    <div class="door-shade" aria-hidden="true"></div>
    <div class="door-slats" aria-hidden="true" [style.--door-panels]="slats.length">
      @for (slat of slats; track slat) {
        <div class="door-slat"></div>
      }
    </div>
    <div class="bottom-light" aria-hidden="true"></div>
    <div class="amber-haze" aria-hidden="true"></div>
    <div class="intro-copy">
      <h2 #title id="garage-intro-title" tabindex="-1">Apaar <em>Garage</em></h2>
      <svg class="intro-hardware" viewBox="0 0 180 126" width="180" height="126" aria-hidden="true">
        <defs>
          <linearGradient id="door-lock-steel" x2="1" y2="1" gradientUnits="objectBoundingBox">
            <stop stop-color="#8f9399" />
            <stop offset=".44" stop-color="#303339" />
            <stop offset="1" stop-color="#68676c" />
          </linearGradient>
          <linearGradient id="door-lock-brass" x2=".8" y2="1" gradientUnits="objectBoundingBox">
            <stop stop-color="#eac287" />
            <stop offset=".52" stop-color="#85542f" />
            <stop offset="1" stop-color="#ddb17c" />
          </linearGradient>
        </defs>
        <rect
          x="38"
          y="22"
          width="104"
          height="34"
          rx="6"
          fill="url(#door-lock-steel)"
          stroke="#b28e66"
        />
        <path d="M48 39h6m72 0h6" stroke="#241c1b" stroke-width="3" stroke-linecap="round" />
        <rect x="74" y="19" width="32" height="43" rx="6" fill="#242127" stroke="#727477" />
        <g class="intro-lock-swing">
          <g class="intro-padlock">
            <path
              class="intro-shackle"
              d="M73 71V54a17 17 0 0 1 34 0v17"
              fill="none"
              stroke="url(#door-lock-steel)"
              stroke-width="9"
              stroke-linecap="round"
            />
            <rect
              x="59"
              y="65"
              width="62"
              height="49"
              rx="8"
              fill="url(#door-lock-brass)"
              stroke="#edbb76"
            />
            <rect x="64" y="70" width="52" height="39" rx="5" fill="none" stroke="#674329" />
            <path d="M87 90a5 5 0 1 1 6 0l2 8H85z" fill="#1d1717" />
          </g>
        </g>
        <g class="intro-key" fill="none" stroke="#f4c782" stroke-width="3">
          <path d="M91 86h29m-9 0v5m-7-5v4" />
          <circle cx="126" cy="86" r="6" />
        </g>
      </svg>
      <button
        class="primary-button"
        type="button"
        autofocus
        [disabled]="opening()"
        (click)="enter()"
      >
        Enter the Garage
      </button>
    </div>
  </dialog>
}
