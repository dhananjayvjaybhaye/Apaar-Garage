<div
  #tabs
  class="hero-categories"
  role="group"
  [attr.aria-label]="tour() ? 'Garage tour categories' : 'Featured categories'"
  [style.--zone-count]="zones.length"
  (keydown)="onKey($event, tabs)"
>
  <span class="category-marker" [style.--zone-index]="activeIndex()" aria-hidden="true"></span>
  @for (zone of zones; track zone.category; let index = $index) {
    <button
      class="secondary-button"
      type="button"
      [attr.aria-pressed]="activeIndex() === index"
      [attr.aria-controls]="tour() ? 'tour-' + zone.category : 'featured'"
      (click)="selectZone.emit(index)"
    >
      {{ zone.name }}
    </button>
  }
</div>
<div class="hero-selection" aria-live="polite">
  @for (item of items(); track item.slug) {
    <button
      #chip
      class="hero-model"
      [class.tour-chip]="tour()"
      type="button"
      aria-haspopup="dialog"
      (pointerenter)="prefetch(item)"
      (touchstart)="prefetch(item)"
      (focus)="prefetch(item)"
      (click)="openProduct.emit({ product: item, source: chip })"
    >
      @if (item.images[0]; as photo) {
        <img
          [src]="photo"
          [attr.srcset]="imageSet(photo)"
          sizes="44px"
          alt=""
          width="44"
          height="36"
          loading="lazy"
          decoding="async"
        />
      }
      <span>{{ item.name }}</span>
      <strong>{{ item.price | currency: 'INR' : 'symbol' : '1.0-2' }}</strong>
    </button>
  } @empty {
    @if (ready() && !tour()) {
      @let zone = zones[activeIndex()];
      <a
        class="secondary-button"
        routerLink="/catalog"
        [queryParams]="zone.category === 'rc' ? { productType: 'rc' } : { category: zone.category }"
        >Browse {{ zone.name }}</a
      >
    }
  }
</div>
